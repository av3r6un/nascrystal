<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Nas Crystal</title>
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="icon" href="img/favicon.ico">
  <meta property="og:title" content="NAS Crystal">
  <meta name="description" content="Премиальные стразы и кристаллы для модных дизайнеров, ателье и танцевальных студий.">
  <meta name="og:description" content="Премиальные стразы и кристаллы для модных дизайнеров, ателье и танцевальных студий.">
  <meta property="og:image" content="https://nascrystal.ru/img/nascrystal.png">
  <meta property="og:site_name" content="NAS Crystal">
  <meta property="og:url" content="https://nascrystal.ru">
  <style>
    @font-face { font-family: 'Inter'; src: url('parking/fonts/Inter-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Cormorant Garamond'; src: url('fonts/CormorantGaramond-Bold.ttf') format('truetype'); font-weight: 800; font-style: normal; }
    * { margin: 0; padding: 0; user-select: none; }
    a { text-decoration: none; color: inherit; font-family: 'Inter'; }
    header { height: 32px; display: flex; align-items: center; color: #817065; border-bottom: 1px solid #E0DAD1; }
    .header_inline { display: flex; align-items: center; width: 100%; max-width: 1280px; margin: 0 auto;}
    .header_inline-item { display: flex; align-items: center; margin-right: 20px; font-size: 14px; }
    .header_inline-item__icon { display: flex; margin-right: 10px; }
    .header_inline-item.last { margin-left: auto; margin-right: 0; }
    main { height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .title { display: flex; align-items: center; gap: 30px; margin-bottom: 30px;}
    .title h1 { font-size: 96px; color: #403126; font-family: 'Cormorant Garamond'; }
    .cta { font-size: 64px; color: #817065; margin-bottom: 30px; font-weight: 100; font-family: 'Inter'; text-align: center;}
    .contact { display: flex; flex-direction: column; align-items: center; justify-content: center;}
    .contact_title { font-size: 32px; color: #444444; margin-bottom: 30px; font-family: 'Inter'; }
    .contact_socials { display: flex; gap: 64px; align-items: center; justify-content: center; width: 100%; }
    .contact_socials a { display: block; }
    footer { width: 100%; }
    .footer.centered { text-align: center; font-weight: 100; color: #817065; font-size: 12px; }
    @media screen { @media (max-width: 665px) { .title { flex-direction: column; } } @media (max-width: 600px) { .cta{ font-size: 48px; } } @media (max-width: 472px) { .header_inline-item {font-size: 12px;} .header_inline-item.last {display: none;} .header_inline {justify-content: center;} } @media (max-width: 440px) { .title h1 { font-size: 64px ;} } }
  </style>
</head>
<body>
  <header>
    <div class="header_inline">
      <div class="header_inline-item">
        <div class="header_inline-item__icon">
          <img src="parking/img/phone.svg" alt="phone">
        </div>
        <div class="header_inline-item__text">
          <a href="tel:+79154185770">+7 (915) 418-57-10</a>
        </div>
      </div>
      <div class="header_inline-item">
        <div class="header_inline-item__icon">
          <img src="parking/img/email.svg" alt="email">
        </div>
        <div class="header_inline-item__text">
          <a href="mailto:info@nascrystal.ru">info@nascrystal.ru</a>
        </div>
      </div>
      <div class="header_inline-item last">
        <div class="header_inline-item__icon"></div>
        <div class="header_inline-item__text">Пн-Пт: 10:00 — 19:00</div>
      </div>
    </div>
  </header>
  <main>
    <div class="title">
      <img src="parking//img/logo.png" alt="logo">
      <h1>Nas Crystal</h1>
    </div>
    <div class="cta">Мы скоро засияем!</div>
    <div class="contact">
      <div class="contact_title">Связаться с нами</div>
      <div class="contact_socials">
        <div class="contact_social">
          <a href="//t.me/straziswarovski" aria-label="Telegram NAS Crystal">
            <img src="parking/img/telegram.svg" alt="tg">
          </a>
        </div>
        <div class="contact_social">
          <a href="//www.instagram.com/crystal_nas96" aria-label="Instagram NAS Crystal">
            <img src="parking/img/instagram.svg" alt="ig">
          </a>
        </div>
        <div class="contact_social">
          <a href="//wa.me/8615727939034" aria-label="WhatsApp NAS Crystal">
            <img src="parking/img/whatsapp.svg" alt="whatsapp">
          </a>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="footer centered">© 2026 NAS Crystals. Все права защищены.</div>
  </footer>
</body>
</html>
